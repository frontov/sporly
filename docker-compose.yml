services:
  backend:
    build:
      context: ./backend
    container_name: sporly-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:8080
      CACHE_TTL_SECONDS: 300
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./backend/app/data:/app/app/data
      - ./backend/app/config/sources.json:/app/app/config/sources.json:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: sporly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  bot:
    build:
      context: ./bot
    container_name: sporly-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_BASE_URL: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
    volumes:
      - ./bot/app/data:/app/app/data
