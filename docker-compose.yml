services:
  backend:
    build:
      context: ./backend
    container_name: sporly-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:8080
      CACHE_TTL_SECONDS: 300
      REFRESH_SCHEDULER_ENABLED: "true"
      REFRESH_INTERVAL_SECONDS: 1800
      EVENT_MISS_THRESHOLD: 3
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./backend/app/data:/app/app/data
      - ./backend/app/config/sources.json:/app/app/config/sources.json:ro
    expose:
      - "8000"

  bot:
    build:
      context: ./bot
    container_name: sporly-bot
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - path: ./bot/.env
        required: false
    environment:
      API_BASE_URL: http://backend:8000
      PARTNER_CONFIG_FILE: /app/app/config/partners.json
    volumes:
      - ./bot/app/data:/app/app/data
      - ./bot/app/config/partners.json:/app/app/config/partners.json:ro
    expose:
      - "8081"

  frontend:
    build:
      context: ./frontend
    container_name: sporly-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - bot
    ports:
      - "8080:80"
