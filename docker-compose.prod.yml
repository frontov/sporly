services:
  backend:
    build:
      context: ./backend
    container_name: sporly-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      SOURCE_TIMEOUT_SECONDS: ${SOURCE_TIMEOUT_SECONDS:-45}
      ENRICH_TIMEOUT_SECONDS: ${ENRICH_TIMEOUT_SECONDS:-12}
      MAX_CONCURRENT_SOURCES: ${MAX_CONCURRENT_SOURCES:-2}
      MAX_ENRICH_EVENTS_PER_SOURCE: ${MAX_ENRICH_EVENTS_PER_SOURCE:-120}
      MINIMUM_REFRESH_RATIO: ${MINIMUM_REFRESH_RATIO:-0.7}
      REFRESH_SCHEDULER_ENABLED: ${REFRESH_SCHEDULER_ENABLED:-true}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-1800}
      EVENT_MISS_THRESHOLD: ${EVENT_MISS_THRESHOLD:-3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./backend/app/data:/app/app/data
      - ./backend/app/config/sources.json:/app/app/config/sources.json:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: sporly-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - bot
    expose:
      - "80"

  bot:
    build:
      context: ./bot
    container_name: sporly-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      API_BASE_URL: http://backend:8000
      PUBLIC_BASE_URL: https://${DOMAIN}
      PARTNER_CONTACT: ${PARTNER_CONTACT:-@fronteno}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-900}
      DIGEST_HOUR_UTC: ${DIGEST_HOUR_UTC:-6}
      QUIET_HOURS_START: ${QUIET_HOURS_START:-22}
      QUIET_HOURS_END: ${QUIET_HOURS_END:-9}
      PARTNER_CONFIG_FILE: /app/app/config/partners.json
    # api.telegram.org resolves to an address filtered by the hosting provider
    # on this VPS, while this Telegram frontend IP stays reachable.
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    volumes:
      - ./bot/app/data:/app/app/data
      - ./bot/app/config/partners.json:/app/app/config/partners.json:ro
    expose:
      - "8081"

  caddy:
    image: caddy:2.8-alpine
    container_name: sporly-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
